name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup override set 1.89.0
      - name: Test protocol math and state helpers
        run: cargo test --locked --manifest-path programs/alliance-passport/Cargo.toml

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install client dependencies
        run: pnpm --dir app install --frozen-lockfile --ignore-scripts
      - name: Test client
        run: pnpm --dir app test
      - name: Build client
        run: pnpm --dir app build
