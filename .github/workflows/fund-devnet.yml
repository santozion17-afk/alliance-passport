name: Fund devnet deployer

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3,15 * * *"

permissions:
  contents: read

concurrency:
  group: alliance-passport-devnet-faucet
  cancel-in-progress: false

jobs:
  fund:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DESTINATION: BHXMca1jXS6vJyoooPQRdoKEouAGwg7Ey3odH3XSoaGQ
      RPC_URL: https://api.devnet.solana.com
      TARGET_LAMPORTS: "5000000000"
    steps:
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Request a bounded devnet allocation
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          for attempt in 1 2; do
            balance="$(solana balance "$DESTINATION" --lamports --url "$RPC_URL" | awk '{print $1}')"
            if (( balance >= TARGET_LAMPORTS )); then
              echo "Devnet target already funded: $balance lamports."
              break
            fi

            echo "Permitted faucet request $attempt of 2; current balance: $balance lamports."
            if ! solana airdrop 2 "$DESTINATION" --url "$RPC_URL"; then
              echo "Request was rate-limited; the next scheduled run will retry."
            fi
          done

          final_balance="$(solana balance "$DESTINATION" --lamports --url "$RPC_URL" | awk '{print $1}')"
          echo "Final devnet balance: $final_balance lamports."
          if (( final_balance < TARGET_LAMPORTS )); then
            echo "Funding remains incomplete; no deployment will be claimed."
          fi
